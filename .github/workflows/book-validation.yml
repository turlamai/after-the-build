name: Book validation
on:
  pull_request:
  push:
    branches: [main, editorial/technical-foundations]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify generated files are committed
        run: git diff --exit-code -- docs/ && test -z "$(git ls-files --others --exclude-standard docs/)"
      - run: node scripts/verify.mjs
      - run: python3 scripts/verify-examples.py
      - uses: actions/upload-artifact@v4
        with:
          name: book-site
          path: docs/
