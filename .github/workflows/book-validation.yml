name: Book validation
on:
  pull_request:
  push:
    branches: [main, editorial/zero-to-understanding]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Draft integration: generated files are synchronized after validation.
      - name: Check committed output on main
        if: github.ref == 'refs/heads/main'
        run: git diff --exit-code -- docs/ && test -z "$(git ls-files --others --exclude-standard docs/)"
      - run: node scripts/verify.mjs
      - run: python3 scripts/verify-examples.py
      - uses: actions/upload-artifact@v4
        with:
          name: book-site
          path: docs/
  sync-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/editorial/zero-to-understanding'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/zero-to-understanding
      - name: Ensure source revision has not moved
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: book-site
          path: docs/
      - name: Commit validated preview
        run: |
          git add docs/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Synchronize validated second-edition site"
          git push origin HEAD:editorial/zero-to-understanding
