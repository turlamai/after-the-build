name: Registration example
on:
  push:
    branches: [editorial/zero-to-understanding, main]
    paths:
      - 'examples/registration/**'
      - '.github/workflows/registration-example.yml'
  pull_request:
    paths:
      - 'examples/registration/**'
      - '.github/workflows/registration-example.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest -v
        working-directory: examples/registration
