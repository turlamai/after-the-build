<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280"><title>两个以太网链路上的 IP 转发</title><g font-family="system-ui,sans-serif" font-size="16" fill="currentColor"><rect x="15" y="25" width="170" height="52" rx="4" stroke="currentColor" fill="none"/><text x="100" y="56" text-anchor="middle" >设备 A</text><rect x="235" y="25" width="170" height="52" rx="4" stroke="currentColor" fill="none"/><text x="320" y="56" text-anchor="middle" >路由器</text><rect x="455" y="25" width="170" height="52" rx="4" stroke="currentColor" fill="none"/><text x="540" y="56" text-anchor="middle" >服务器 B</text><path d="M185 51L235 51" stroke="currentColor" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(235 51) rotate(0)" stroke="currentColor" fill="none"/><path d="M405 51L455 51" stroke="currentColor" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(455 51) rotate(0)" stroke="currentColor" fill="none"/><text x="100" y="99" text-anchor="middle" font-size='13'>192.168.1.20</text><text x="540" y="99" text-anchor="middle" font-size='13'>192.168.2.80</text><rect x="20" y="125" width="290" height="42" rx="4" stroke="currentColor" fill="none"/><text x="165" y="151" text-anchor="middle" >MAC：A → 路由器入口</text><rect x="330" y="125" width="290" height="42" rx="4" stroke="currentColor" fill="none"/><text x="475" y="151" text-anchor="middle" >MAC：路由器出口 → B</text><rect x="20" y="180" width="290" height="48" rx="4" stroke="currentColor" fill="none"/><text x="165" y="209" text-anchor="middle" >IP：A → B</text><rect x="330" y="180" width="290" height="48" rx="4" stroke="currentColor" fill="none"/><text x="475" y="209" text-anchor="middle" >IP：A → B</text><text x="320" y="257" text-anchor="middle" font-size='14'>普通路由，不考虑 NAT；TTL 递减</text></g></svg>