<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260"><title>系统调用跨越保护边界</title><g font-family="system-ui,sans-serif" font-size="16" fill="currentColor"><rect x="35" y="20" width="230" height="52" rx="4" fill="none" stroke="currentColor"/><text x="150" y="51" text-anchor="middle" >应用与系统库</text><rect x="375" y="20" width="230" height="52" rx="4" fill="none" stroke="currentColor"/><text x="490" y="51" text-anchor="middle" >返回数据或错误</text><path d="M20 113H620" stroke="currentColor" stroke-width="1.5" fill="none"/> <text x="110" y="102" text-anchor="middle" font-size='14'>用户空间</text><text x="110" y="135" text-anchor="middle" font-size='14'>内核空间</text><rect x="35" y="155" width="230" height="52" rx="4" fill="none" stroke="currentColor"/><text x="150" y="186" text-anchor="middle" >系统调用入口</text><rect x="375" y="155" width="230" height="52" rx="4" fill="none" stroke="currentColor"/><text x="490" y="186" text-anchor="middle" >权限检查与读取</text><path d="M150 72L150 155" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(150 155) rotate(90)" stroke="currentColor" fill="none"/><path d="M265 181L375 181" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(375 181) rotate(0)" stroke="currentColor" fill="none"/><path d="M490 155L490 72" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(490 72) rotate(-90)" stroke="currentColor" fill="none"/><text x="320" y="240" text-anchor="middle" font-size='14'>受控入口，不是直接取得全部内核权限</text></g></svg>