<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="system-ui, sans-serif"><rect width="760" height="460" rx="12" fill="#FAF9F6"/><text x="32" y="42" font-size="22" font-weight="600" fill="#2A2820">Git 的工作状态与远程协作</text><rect x="32" y="66" width="696" height="62" rx="7" fill="#FFFFFF" stroke="#D9D3C7"/><text x="49" y="91" font-size="17" font-weight="600" fill="#2A2820">工作区 Working Tree</text><text x="49" y="113" font-size="15" fill="#4A4740">当前文件及未提交修改</text><path d="M380 128 v15 m-5 -5 l5 5 5 -5" stroke="#C4683F" stroke-width="2" fill="none"/><rect x="32" y="149" width="696" height="62" rx="7" fill="#FFFFFF" stroke="#D9D3C7"/><text x="49" y="174" font-size="17" font-weight="600" fill="#2A2820">暂存区 Index</text><text x="49" y="196" font-size="15" fill="#4A4740">准备提交的文件快照</text><path d="M380 211 v15 m-5 -5 l5 5 5 -5" stroke="#C4683F" stroke-width="2" fill="none"/><rect x="32" y="232" width="696" height="62" rx="7" fill="#FFFFFF" stroke="#D9D3C7"/><text x="49" y="257" font-size="17" font-weight="600" fill="#2A2820">本地仓库 Repository</text><text x="49" y="279" font-size="15" fill="#4A4740">Commit + 父提交 + 对象</text><path d="M380 294 v15 m-5 -5 l5 5 5 -5" stroke="#C4683F" stroke-width="2" fill="none"/><rect x="32" y="315" width="696" height="62" rx="7" fill="#FFFFFF" stroke="#D9D3C7"/><text x="49" y="340" font-size="17" font-weight="600" fill="#2A2820">远程仓库 Remote</text><text x="49" y="362" font-size="15" fill="#4A4740">通过 push / fetch 交换对象及引用</text><text x="32" y="428" font-size="13" fill="#4A4740">git add 更新暂存区，commit 创建提交，push 更新远程引用。</text></svg>
