<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="system-ui, sans-serif"><rect width="760" height="460" rx="12" fill="#FAF9F6"/><text x="32" y="42" font-size="22" font-weight="600" fill="#2A2820">密码学原语及其安全属性</text><rect x="32" y="66" width="696" height="62" rx="7" fill="#FFFFFF" stroke="#D9D3C7"/><text x="49" y="91" font-size="17" font-weight="600" fill="#2A2820">认证加密 AEAD</text><text x="49" y="113" font-size="15" fill="#4A4740">密钥 + nonce → 密文及认证标签</text><path d="M380 128 v15 m-5 -5 l5 5 5 -5" stroke="#C4683F" stroke-width="2" fill="none"/><rect x="32" y="149" width="696" height="62" rx="7" fill="#FFFFFF" stroke="#D9D3C7"/><text x="49" y="174" font-size="17" font-weight="600" fill="#2A2820">哈希 SHA-256</text><text x="49" y="196" font-size="15" fill="#4A4740">消息 → 固定长度摘要</text><path d="M380 211 v15 m-5 -5 l5 5 5 -5" stroke="#C4683F" stroke-width="2" fill="none"/><rect x="32" y="232" width="696" height="62" rx="7" fill="#FFFFFF" stroke="#D9D3C7"/><text x="49" y="257" font-size="17" font-weight="600" fill="#2A2820">消息认证码 HMAC</text><text x="49" y="279" font-size="15" fill="#4A4740">共享秘密 + 消息 → 认证码</text><path d="M380 294 v15 m-5 -5 l5 5 5 -5" stroke="#C4683F" stroke-width="2" fill="none"/><rect x="32" y="315" width="696" height="62" rx="7" fill="#FFFFFF" stroke="#D9D3C7"/><text x="49" y="340" font-size="17" font-weight="600" fill="#2A2820">数字签名</text><text x="49" y="362" font-size="15" fill="#4A4740">私钥签名；可信公钥验证</text><text x="32" y="428" font-size="13" fill="#4A4740">摘要不证明来源；密码保存需要专用密码哈希与独立盐。</text></svg>
