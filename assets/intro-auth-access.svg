<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260"><title>先验证身份再检查资源权限</title><g font-family="system-ui,sans-serif" font-size="16" fill="currentColor"><rect x="15" y="35" width="135" height="60" rx="6" fill="none" stroke="currentColor"/><text x="82.5" y="70" text-anchor="middle">访问请求</text><rect x="190" y="35" width="170" height="60" rx="6" fill="none" stroke="currentColor"/><text x="275" y="70" text-anchor="middle">身份认证</text><rect x="400" y="35" width="185" height="60" rx="6" fill="none" stroke="currentColor"/><text x="492.5" y="70" text-anchor="middle">资源授权</text><path d="M150 65L190 65" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(190 65) rotate(0)" stroke="currentColor" fill="none"/><path d="M360 65L400 65" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(400 65) rotate(0)" stroke="currentColor" fill="none"/><rect x="190" y="155" width="170" height="55" rx="6" fill="none" stroke="currentColor"/><text x="275" y="187.5" text-anchor="middle">拒绝：认证失败</text><rect x="400" y="155" width="185" height="55" rx="6" fill="none" stroke="currentColor"/><text x="492.5" y="187.5" text-anchor="middle">允许或拒绝访问</text><path d="M275 95L275 155" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(275 155) rotate(90)" stroke="currentColor" fill="none"/><path d="M492 95L492 155" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(492 155) rotate(90)" stroke="currentColor" fill="none"/><text x="300" y="245" text-anchor="middle" font-size="14">认证成功不等于获得全部资源的访问权</text></g></svg>