<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="system-ui, sans-serif"><rect width="760" height="460" rx="12" fill="#FAF9F6"/><text x="32" y="42" font-size="22" font-weight="600" fill="#2A2820">存储层次与访问路径</text><rect x="32" y="66" width="696" height="62" rx="7" fill="#FFFFFF" stroke="#D9D3C7"/><text x="49" y="91" font-size="17" font-weight="600" fill="#2A2820">CPU 寄存器</text><text x="49" y="113" font-size="15" fill="#4A4740">当前指令与执行状态</text><path d="M380 128 v15 m-5 -5 l5 5 5 -5" stroke="#C4683F" stroke-width="2" fill="none"/><rect x="32" y="149" width="696" height="62" rx="7" fill="#FFFFFF" stroke="#D9D3C7"/><text x="49" y="174" font-size="17" font-weight="600" fill="#2A2820">L1 / L2 / L3 Cache</text><text x="49" y="196" font-size="15" fill="#4A4740">缓存行与局部性</text><path d="M380 211 v15 m-5 -5 l5 5 5 -5" stroke="#C4683F" stroke-width="2" fill="none"/><rect x="32" y="232" width="696" height="62" rx="7" fill="#FFFFFF" stroke="#D9D3C7"/><text x="49" y="257" font-size="17" font-weight="600" fill="#2A2820">RAM 主存</text><text x="49" y="279" font-size="15" fill="#4A4740">运行中的数据与代码</text><path d="M380 294 v15 m-5 -5 l5 5 5 -5" stroke="#C4683F" stroke-width="2" fill="none"/><rect x="32" y="315" width="696" height="62" rx="7" fill="#FFFFFF" stroke="#D9D3C7"/><text x="49" y="340" font-size="17" font-weight="600" fill="#2A2820">SSD 持久化存储</text><text x="49" y="362" font-size="15" fill="#4A4740">文件、程序及数据库</text><text x="32" y="428" font-size="13" fill="#4A4740">越靠近 CPU，通常延迟越低、容量越小；SSD 不属于 CPU 缓存层。</text></svg>
