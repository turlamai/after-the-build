<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 245" width="640" height="245"><title>Git 三个状态在同一时刻保存不同内容</title><g font-family="system-ui,sans-serif" font-size="16" fill="currentColor" text-anchor="middle"><g stroke="currentColor" fill="none"><rect x="15" y="45" width="180" height="65" rx="4"/><rect x="230" y="45" width="180" height="65" rx="4"/><rect x="445" y="45" width="180" height="65" rx="4"/><path d="M105 110V133H320V110M320 133H535V110"/></g><text x="105" y="72">工作目录</text><text x="105" y="95">内容 C</text><text x="320" y="72">暂存区</text><text x="320" y="95">内容 B</text><text x="535" y="72">当前提交</text><text x="535" y="95">内容 A</text><text x="212" y="153" font-size="14">git diff：C 与 B</text><text x="427" y="153" font-size="14">git diff --cached：B 与 A</text><text x="320" y="189" font-size="14">此刻执行 git commit，提交的是 B，不是 C。</text><text x="320" y="217" font-size="13">若先重新 git add，暂存内容才会更新为 C。</text></g></svg>