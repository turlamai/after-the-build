<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240"><title>工作目录、暂存区与提交</title><g font-family="system-ui,sans-serif" font-size="16" fill="currentColor"><rect x="15" y="70" width="180" height="65" rx="4" stroke="currentColor" fill="none"/><text x="105" y="107.5" text-anchor="middle" >工作目录：C</text><rect x="230" y="70" width="180" height="65" rx="4" stroke="currentColor" fill="none"/><text x="320" y="107.5" text-anchor="middle" >暂存区：B</text><rect x="445" y="70" width="180" height="65" rx="4" stroke="currentColor" fill="none"/><text x="535" y="107.5" text-anchor="middle" >当前提交：A</text><path d="M195 102L230 102" stroke="currentColor" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(230 102) rotate(0)" stroke="currentColor" fill="none"/><path d="M410 102L445 102" stroke="currentColor" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(445 102) rotate(0)" stroke="currentColor" fill="none"/><text x="212" y="54" text-anchor="middle" font-size='13'>git add</text><text x="427" y="54" text-anchor="middle" font-size='13'>git commit</text><text x="212" y="170" text-anchor="middle" font-size='14'>git diff</text><text x="427" y="170" text-anchor="middle" font-size='14'>git diff --cached</text><text x="320" y="215" text-anchor="middle" font-size='14'>示例：文件暂存 B 之后又修改为 C</text></g></svg>