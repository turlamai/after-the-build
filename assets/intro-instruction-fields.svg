<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220"><title>虚构的16位机器指令</title><g font-family="system-ui,sans-serif" font-size="16" fill="currentColor"><rect x="20" y="35" width="150" height="85" fill="none" stroke="currentColor"/><text x="95" y="63" text-anchor="middle" >操作码</text><text x="95" y="98" text-anchor="middle" font-family='monospace' font-size='22'>0001</text><rect x="170" y="35" width="150" height="85" fill="none" stroke="currentColor"/><text x="245" y="63" text-anchor="middle" >寄存器</text><text x="245" y="98" text-anchor="middle" font-family='monospace' font-size='22'>0001</text><rect x="320" y="35" width="300" height="85" fill="none" stroke="currentColor"/><text x="470" y="63" text-anchor="middle" >数据地址</text><text x="470" y="98" text-anchor="middle" font-family='monospace' font-size='22'>01100100</text><text x="95" y="146" text-anchor="middle" >LOAD (1)</text><text x="245" y="146" text-anchor="middle" >R1</text><text x="470" y="146" text-anchor="middle" >100 (0x64)</text><text x="320" y="198" text-anchor="middle" >0x1164 → LOAD R1, 100</text></g></svg>