<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" height="210"><title>八位补码</title><g font-family="system-ui,sans-serif" fill="currentColor" font-size="16"><rect x="48" y="62" width="68" height="38" rx="2" stroke="currentColor" fill="none"/><text x="82" y="87" text-anchor="middle" >1</text><rect x="116" y="62" width="68" height="38" rx="2" stroke="currentColor" fill="none"/><text x="150" y="87" text-anchor="middle" >1</text><rect x="184" y="62" width="68" height="38" rx="2" stroke="currentColor" fill="none"/><text x="218" y="87" text-anchor="middle" >1</text><rect x="252" y="62" width="68" height="38" rx="2" stroke="currentColor" fill="none"/><text x="286" y="87" text-anchor="middle" >1</text><rect x="320" y="62" width="68" height="38" rx="2" stroke="currentColor" fill="none"/><text x="354" y="87" text-anchor="middle" >1</text><rect x="388" y="62" width="68" height="38" rx="2" stroke="currentColor" fill="none"/><text x="422" y="87" text-anchor="middle" >0</text><rect x="456" y="62" width="68" height="38" rx="2" stroke="currentColor" fill="none"/><text x="490" y="87" text-anchor="middle" >1</text><rect x="524" y="62" width="68" height="38" rx="2" stroke="currentColor" fill="none"/><text x="558" y="87" text-anchor="middle" >1</text><text x="82" y="43" text-anchor="middle" fill='#c4683f'>-128</text><text x="150" y="43" text-anchor="middle" >64</text><text x="218" y="43" text-anchor="middle" >32</text><text x="286" y="43" text-anchor="middle" >16</text><text x="354" y="43" text-anchor="middle" >8</text><text x="422" y="43" text-anchor="middle" >4</text><text x="490" y="43" text-anchor="middle" >2</text><text x="558" y="43" text-anchor="middle" >1</text><text x="320" y="140" text-anchor="middle" font-size='15'>−128 + 64 + 32 + 16 + 8 + 0 + 2 + 1 = −5</text><text x="320" y="178" text-anchor="middle" font-size='14'>最左位采用负权重；其余位权重不变</text></g></svg>