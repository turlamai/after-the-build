<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 245" width="640" height="245"><title>虚拟地址转换示例</title><g font-family="system-ui,sans-serif" font-size="16" fill="currentColor"><text x="120" y="25" text-anchor="middle" >虚拟地址 0x1234</text><rect x="20" y="40" width="100" height="48" rx="4" fill="none" stroke="currentColor"/><text x="70" y="69" text-anchor="middle" >页 1</text><rect x="120" y="40" width="180" height="48" rx="4" fill="none" stroke="currentColor"/><text x="210" y="69" text-anchor="middle" >偏移 0x234</text><rect x="20" y="135" width="100" height="48" rx="4" fill="none" stroke="currentColor"/><text x="70" y="164" text-anchor="middle" >页框 5</text><rect x="120" y="135" width="180" height="48" rx="4" fill="none" stroke="currentColor"/><text x="210" y="164" text-anchor="middle" >偏移 0x234</text><rect x="380" y="70" width="230" height="75" rx="4" fill="none" stroke="currentColor"/><text x="495" y="112.5" text-anchor="middle" >页表：1 → 5</text><path d="M70 88V110H355V85H380M380 130H355V159H120" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M210 88L210 135" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(210 135) rotate(90)" stroke="currentColor" fill="none"/><text x="320" y="220" text-anchor="middle" font-size='15'>物理地址 0x5234；页内偏移不变</text></g></svg>