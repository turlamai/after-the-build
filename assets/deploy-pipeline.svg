<svg xmlns="http://www.w3.org/2000/svg" width="650" viewBox="0 0 760 660" font-family="PingFang SC, Microsoft YaHei, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <rect width="760" height="660" fill="#f8f6f3"/>
  <text x="40" y="34" font-size="13" font-weight="600" fill="#1a1a1a">从 localhost 到全世界的五步</text>

  <rect x="230" y="70" width="300" height="64" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="380" y="96" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">① 你的电脑</text>
  <text x="380" y="118" font-size="9" fill="#1a1a1a" text-anchor="middle">程序只活在本地，别人敲不到门</text>

  <rect x="230" y="190" width="300" height="64" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="380" y="216" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">② GitHub 仓库</text>
  <text x="380" y="238" font-size="9" fill="#1a1a1a" text-anchor="middle">代码有了云端的窝，还顺手成了备份</text>

  <rect x="230" y="310" width="300" height="64" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="380" y="336" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">③ 托管平台</text>
  <text x="380" y="358" font-size="9" fill="#1a1a1a" text-anchor="middle">监听仓库，拿到最新代码自动构建</text>

  <rect x="230" y="430" width="300" height="64" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="380" y="456" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">④ 服务器 + 网址</text>
  <text x="380" y="478" font-size="9" fill="#1a1a1a" text-anchor="middle">搬进机房，发一个全世界能查到的地址</text>

  <rect x="230" y="550" width="300" height="64" rx="12" fill="#a8c5e6" stroke="#d97757" stroke-width="2"/>
  <text x="380" y="576" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">⑤ 全世界</text>
  <text x="380" y="598" font-size="9" fill="#1a1a1a" text-anchor="middle">任何人打开网址就能用——序章问题的正面解</text>

  <line x1="380" y1="134" x2="380" y2="186" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="254" x2="380" y2="306" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="374" x2="380" y2="426" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="494" x2="380" y2="546" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="40" y="644" font-size="9" fill="#6a6a6a">全程你只需要点几次按钮——十年前的专业活，已经被托管平台封装好了。</text>
</svg>
