<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 255" width="640" height="255"><title>直接映射缓存示例</title><g font-family="system-ui,sans-serif" font-size="16" fill="currentColor"><rect x="20" y="20" width="170" height="42" rx="4" fill="none" stroke="currentColor"/><text x="105" y="46" text-anchor="middle" >块 0：地址 0–3</text><rect x="20" y="90" width="170" height="42" rx="4" fill="none" stroke="currentColor"/><text x="105" y="116" text-anchor="middle" >块 1：地址 4–7</text><rect x="20" y="160" width="170" height="42" rx="4" fill="none" stroke="currentColor"/><text x="105" y="186" text-anchor="middle" >块 2：地址 8–11</text><rect x="430" y="45" width="180" height="56" rx="4" fill="none" stroke="currentColor"/><text x="520" y="78" text-anchor="middle" >缓存行 0</text><rect x="430" y="145" width="180" height="56" rx="4" fill="none" stroke="currentColor"/><text x="520" y="178" text-anchor="middle" >缓存行 1</text><path d="M190 41H300V62H430M190 111H330V173H430M190 181H275V85H430" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="355" y="28" text-anchor="middle" font-size='13'>块 0 与块 2 冲突</text><text x="320" y="234" text-anchor="middle" font-size='14'>映射到同一行的块可能相互替换</text></g></svg>