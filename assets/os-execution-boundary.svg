<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="system-ui, sans-serif"><rect width="760" height="460" rx="12" fill="#FAF9F6"/><text x="32" y="42" font-size="22" font-weight="600" fill="#2A2820">应用与操作系统的执行边界</text><rect x="32" y="66" width="696" height="62" rx="7" fill="#FFFFFF" stroke="#D9D3C7"/><text x="49" y="91" font-size="17" font-weight="600" fill="#2A2820">用户空间</text><text x="49" y="113" font-size="15" fill="#4A4740">应用进程 A / 应用进程 B</text><path d="M380 128 v15 m-5 -5 l5 5 5 -5" stroke="#C4683F" stroke-width="2" fill="none"/><rect x="32" y="149" width="696" height="62" rx="7" fill="#FFFFFF" stroke="#D9D3C7"/><text x="49" y="174" font-size="17" font-weight="600" fill="#2A2820">系统调用接口</text><text x="49" y="196" font-size="15" fill="#4A4740">open / read / socket 等</text><path d="M380 211 v15 m-5 -5 l5 5 5 -5" stroke="#C4683F" stroke-width="2" fill="none"/><rect x="32" y="232" width="696" height="62" rx="7" fill="#FFFFFF" stroke="#D9D3C7"/><text x="49" y="257" font-size="17" font-weight="600" fill="#2A2820">内核</text><text x="49" y="279" font-size="15" fill="#4A4740">调度器 · 虚拟内存 · 文件系统</text><path d="M380 294 v15 m-5 -5 l5 5 5 -5" stroke="#C4683F" stroke-width="2" fill="none"/><rect x="32" y="315" width="696" height="62" rx="7" fill="#FFFFFF" stroke="#D9D3C7"/><text x="49" y="340" font-size="17" font-weight="600" fill="#2A2820">设备驱动与硬件</text><text x="49" y="362" font-size="15" fill="#4A4740">CPU · RAM · 网卡 · SSD</text><text x="32" y="428" font-size="13" fill="#4A4740">系统调用跨越用户态与内核态；调度与地址映射由内核和硬件协作。</text></svg>
