<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250"><title>界面结构与渲染</title><g font-family="system-ui,sans-serif" font-size="16" fill="currentColor"><rect x="20" y="20" width="180" height="46" rx="5" stroke="currentColor" fill="none"/><text x="110" y="48" text-anchor="middle" >部件结构</text><rect x="230" y="20" width="180" height="46" rx="5" stroke="currentColor" fill="none"/><text x="320" y="48" text-anchor="middle" >布局计算</text><rect x="440" y="20" width="180" height="46" rx="5" stroke="currentColor" fill="none"/><text x="530" y="48" text-anchor="middle" >绘制与合成</text><path d="M200 43L230 43" stroke="currentColor" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(230 43) rotate(0)" stroke="currentColor" fill="none"/><path d="M410 43L440 43" stroke="currentColor" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(440 43) rotate(0)" stroke="currentColor" fill="none"/><rect x="450" y="105" width="160" height="100" rx="4" stroke="currentColor" fill="none"/><text x="530" y="127" text-anchor="middle" font-size='13'>活动报名</text><rect x="465" y="138" width="130" height="20" rx="2" stroke="currentColor" fill="none"/><rect x="465" y="168" width="130" height="23" rx="2" stroke="currentColor" fill="#c4683f" fill-opacity=".15"/><text x="530" y="184" text-anchor="middle" font-size='12'>确认报名</text><path d="M530 66L530 105" stroke="currentColor" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(530 105) rotate(90)" stroke="currentColor" fill="none"/><rect x="20" y="130" width="180" height="55" rx="5" stroke="currentColor" fill="none"/><text x="110" y="162.5" text-anchor="middle" >鼠标或键盘输入</text><rect x="230" y="130" width="180" height="55" rx="5" stroke="currentColor" fill="none"/><text x="320" y="162.5" text-anchor="middle" >事件目标与焦点</text><path d="M200 157L230 157" stroke="currentColor" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(230 157) rotate(0)" stroke="currentColor" fill="none"/><path d="M320 130L320 66"