<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250"><title>一次请求的嵌套耗时</title><g font-family="system-ui,sans-serif" font-size="16" fill="currentColor"><g font-size="14"><text x="15" y="55">入口</text><text x="15" y="105">后端</text><text x="15" y="155">数据库</text></g><rect x="100" y="35" width="460" height="30" rx="4" fill="#c4683f" fill-opacity=".17" stroke="currentColor" stroke-opacity=".6"/><text x="330" y="55" text-anchor="middle" font-size="14">800 ms</text><rect x="140" y="85" width="360" height="30" rx="4" fill="#c4683f" fill-opacity=".17" stroke="currentColor" stroke-opacity=".6"/><text x="320" y="105" text-anchor="middle" font-size="14">626 ms</text><rect x="190" y="135" width="230" height="30" rx="4" fill="#c4683f" fill-opacity=".17" stroke="currentColor" stroke-opacity=".6"/><text x="305" y="155" text-anchor="middle" font-size="14">400 ms</text><path d="M100 195H560m-7-5 7 5-7 5" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="560" y="220" text-anchor="end" font-size="14">时间</text><text x="300" y="243" font-size="12" text-anchor="middle">假设耗时；嵌套区间不可直接相加</text></g></svg>