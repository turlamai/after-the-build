<svg xmlns="http://www.w3.org/2000/svg" width="650" viewBox="0 0 1000 400" font-family="PingFang SC, Microsoft YaHei, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <rect width="1000" height="400" fill="#f8f6f3"/>
  <text x="40" y="34" font-size="13" font-weight="600" fill="#1a1a1a">大模型的全部工作：预测下一个字，再接龙下去</text>

  <rect x="40" y="160" width="200" height="90" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="140" y="196" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">你的输入</text>
  <text x="140" y="222" font-size="11" fill="#1a1a1a" text-anchor="middle">今天天气真……</text>

  <rect x="400" y="150" width="220" height="100" rx="12" fill="#d97757" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="510" y="192" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">大模型</text>
  <text x="510" y="216" font-size="9" fill="#ffffff" text-anchor="middle">预测最合理的下一个字</text>

  <rect x="740" y="120" width="220" height="160" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="850" y="150" font-size="10" fill="#1a1a1a" text-anchor="middle">候选（概率从高到低）</text>
  <text x="850" y="180" font-size="11" fill="#1a1a1a" text-anchor="middle">好　87%</text>
  <text x="850" y="208" font-size="11" fill="#6a6a6a" text-anchor="middle">不错　9%</text>
  <text x="850" y="236" font-size="11" fill="#6a6a6a" text-anchor="middle">冷　3%</text>

  <line x1="240" y1="205" x2="396" y2="205" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="200" x2="736" y2="200" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M 850 116 Q 850 40 500 40 Q 150 40 140 156" fill="none" stroke="#d97757" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="60" font-size="10" fill="#d97757" text-anchor="middle">选中「好」，拼回输入，再预测下一个字……一个字一个字滚出整段回答</text>

  <text x="40" y="330" font-size="9" fill="#6a6a6a">读懂这张图，三个现象全部有了答案：幻觉是接龙接错了但语气笃定；知识截止是书只读到某一天；时好时坏是概率本来就不保证。</text>
  <text x="40" y="354" font-size="9" fill="#6a6a6a">它不是在「知道」，它是在预测——重要的事实，永远出口对证一次。</text>
</svg>
