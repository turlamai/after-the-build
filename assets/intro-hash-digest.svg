<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260"><title>哈希将不同长度的数据映射为固定长度摘要</title><g font-family="system-ui,sans-serif" font-size="16" fill="currentColor"><rect x="15" y="35" width="150" height="55" rx="6" fill="none" stroke="currentColor"/><text x="90" y="67.5" text-anchor="middle">输入 abc</text><rect x="15" y="145" width="150" height="55" rx="6" fill="none" stroke="currentColor"/><text x="90" y="177.5" text-anchor="middle">输入 abcd</text><rect x="215" y="85" width="160" height="65" rx="6" fill="none" stroke="currentColor"/><text x="295" y="122.5" text-anchor="middle">SHA-256</text><rect x="425" y="35" width="160" height="55" rx="6" fill="none" stroke="currentColor"/><text x="505" y="67.5" text-anchor="middle">256 位摘要 A</text><rect x="425" y="145" width="160" height="55" rx="6" fill="none" stroke="currentColor"/><text x="505" y="177.5" text-anchor="middle">256 位摘要 B</text><path d="M165 62H190V104H215M165 172H190V133H215M375 104H400V62H425M375 133H400V172H425" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="300" y="240" text-anchor="middle" font-size="14">摘要长度相同；安全哈希的结果不能按原数据逆向解码</text></g></svg>