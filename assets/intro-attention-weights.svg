<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" width="600" height="270"><title>加权组合的简化计算</title><g font-family="system-ui,sans-serif" font-size="16" fill="currentColor"><rect x="35" y="20" width="170" height="50" rx="6" fill="none" stroke="currentColor"/><text x="120" y="50" text-anchor="middle">信息值 10</text><rect x="215" y="20" width="170" height="50" rx="6" fill="none" stroke="currentColor"/><text x="300" y="50" text-anchor="middle">信息值 20</text><rect x="395" y="20" width="170" height="50" rx="6" fill="none" stroke="currentColor"/><text x="480" y="50" text-anchor="middle">信息值 30</text><text x="120" y="105" text-anchor="middle">权重 0.1</text><path d="M120 70V85M120 115V140H300V165" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="300" y="105" text-anchor="middle">权重 0.2</text><path d="M300 70V85M300 115V140H300V165" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="480" y="105" text-anchor="middle">权重 0.7</text><path d="M480 70V85M480 115V140H300V165" stroke="currentColor" stroke-width="1.6" fill="none"/><rect x="150" y="165" width="300" height="55" rx="6" fill="none" stroke="currentColor"/><text x="300" y="197.5" text-anchor="middle">10×0.1 + 20×0.2 + 30×0.7 = 26</text><text x="300" y="250" font-size="14" text-anchor="middle">仅示意加权组合，不是完整注意力算法</text></g></svg>