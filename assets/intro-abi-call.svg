<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250"><title>同一函数接口与不同调用约定</title><g font-family="system-ui,sans-serif" font-size="16" fill="currentColor"><text x="320" y="25" text-anchor="middle" >API: add(3, 5) → 8</text><rect x="20" y="65" width="290" height="50" rx="5" stroke="currentColor" fill="none"/><text x="165" y="95" text-anchor="middle" >规则 A：参数放寄存器</text><rect x="330" y="65" width="290" height="50" rx="5" stroke="currentColor" fill="none"/><text x="475" y="95" text-anchor="middle" >规则 B：参数放栈</text><rect x="25" y="145" width="135" height="45" rx="5" stroke="currentColor" fill="none"/><text x="92.5" y="172.5" text-anchor="middle" >R1 = 3</text><rect x="170" y="145" width="135" height="45" rx="5" stroke="currentColor" fill="none"/><text x="237.5" y="172.5" text-anchor="middle" >R2 = 5</text><rect x="335" y="145" width="135" height="45" rx="5" stroke="currentColor" fill="none"/><text x="402.5" y="172.5" text-anchor="middle" >栈槽 0 = 3</text><rect x="480" y="145" width="135" height="45" rx="5" stroke="currentColor" fill="none"/><text x="547.5" y="172.5" text-anchor="middle" >栈槽 1 = 5</text><path d="M165 115L92 145" stroke="currentColor" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(92 145) rotate(157.6593520400059)" stroke="currentColor" fill="none"/><path d="M165 115L237 145" stroke="currentColor" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(237 145) rotate(22.619864948040426)" stroke="currentColor" fill="none"/><path d="M475 115L402 145" stroke="currentColor" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(402 145) rotate(157.6593520400059)" stroke="currentColor" fill="none"/><path d="M475 115L547 145" stroke="currentColor" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(547 145) rotate(22.619864948040426)" stroke="currentColor" fill="none"/><text x="320" y="230" text-anchor="middle" font-size='14'>二进制调用者与实现必须采用一致规则</text></g></svg>