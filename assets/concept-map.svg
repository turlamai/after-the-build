<svg xmlns="http://www.w3.org/2000/svg" width="650" viewBox="0 0 980 840" font-family="PingFang SC, Microsoft YaHei, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <rect width="980" height="840" fill="#f8f6f3"/>
  <text x="40" y="34" font-size="13" font-weight="600" fill="#1a1a1a">全书概念地图：四十个概念的住址</text>
  <text x="40" y="56" font-size="9" fill="#6a6a6a">四层结构，每一层踩在上一层的地基上——章节顺序是依赖的顺序，不是目录的排法</text>

  <!-- band 1: worldview -->
  <rect x="40" y="80" width="900" height="170" rx="12" fill="#a8c5e6" fill-opacity="0.25" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="64" y="106" font-size="11" font-weight="600" fill="#1a1a1a">第一部 世界观（第 1-5 章）——先看见机器世界的形状</text>
  <text x="64" y="134" font-size="9" fill="#1a1a1a">第 1 章 平台形态：原生应用 / 桌面软件 / 网页 / 分发 / 应用商店</text>
  <text x="64" y="158" font-size="9" fill="#1a1a1a">第 2 章 文件与路径：文件 / 文件夹 / 路径 / 扩展名 / 盘符与目录树</text>
  <text x="64" y="182" font-size="9" fill="#1a1a1a">第 3 章 两种接口：GUI / 命令行 / 终端 / 权限</text>
  <text x="64" y="206" font-size="9" fill="#1a1a1a">第 4 章 编程语言：源代码 / 歧义 / 变量·条件·循环 / 牵连</text>
  <text x="64" y="230" font-size="9" fill="#1a1a1a">第 5 章 网络：客户端 / 服务器 / IP / 域名 / DNS / localhost / HTTPS</text>

  <!-- band 2: operations -->
  <rect x="40" y="290" width="900" height="196" rx="12" fill="#9dd4c7" fill-opacity="0.25" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="64" y="316" font-size="11" font-weight="600" fill="#1a1a1a">第二部 造完之后（第 6-11 章）——踩着世界观长出的六件手艺</text>
  <text x="64" y="344" font-size="9" fill="#1a1a1a">第 6 章 部署：托管 / 仓库 / 域名 / 上线五步（地基：第 5 章的网络）</text>
  <text x="64" y="368" font-size="9" fill="#1a1a1a">第 7 章 验收与排错：复现 / 报错 / 回归 / 缓存（地基：第 4 章的牵连）</text>
  <text x="64" y="392" font-size="9" fill="#1a1a1a">第 8 章 密钥：API Key / 环境变量 / 最小权限（地基：第 5 章的 HTTPS）</text>
  <text x="64" y="416" font-size="9" fill="#1a1a1a">第 9 章 成本：算力 / 存储 / 流量 / 订阅 / token（地基：第 6 章的托管）</text>
  <text x="64" y="440" font-size="9" fill="#1a1a1a">第 10 章 数据：数据库 / 备份 / 导出 / 平台锁定（地基：第 2 章的文件树）</text>
  <text x="64" y="464" font-size="9" fill="#1a1a1a">第 11 章 版本：依赖 / Git / 提交 / 回滚（地基：第 4 章的牵连）</text>

  <!-- band 3: judgment -->
  <rect x="40" y="526" width="900" height="120" rx="12" fill="#f4e4c1" fill-opacity="0.5" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="64" y="552" font-size="11" font-weight="600" fill="#1a1a1a">第三部 拿住之后（第 12-14 章）——判断力，以动手为前提</text>
  <text x="64" y="580" font-size="9" fill="#1a1a1a">第 12 章 安全：密码管理器 / 两步验证 / 红线（地基：第 8 章的密钥）</text>
  <text x="64" y="604" font-size="9" fill="#1a1a1a">第 13 章 找人：赌注 / 求助说明书 / 产权（地基：第 7 章的自查清单）</text>
  <text x="64" y="628" font-size="9" fill="#1a1a1a">第 14 章 维护：体检 / 证书 / 下线（地基：第 9、10 章的钱和数据）</text>

  <!-- band 4: one page -->
  <rect x="40" y="686" width="900" height="112" rx="12" fill="#d97757" fill-opacity="0.15" stroke="#d97757" stroke-width="1.5"/>
  <text x="64" y="712" font-size="11" font-weight="600" fill="#1a1a1a">第四部 一页纸（第 15 章 + 附录）——全部判断压成随身清单</text>
  <text x="64" y="740" font-size="9" fill="#1a1a1a">第 15 章 四十个问题：上线前 / 分享前 / 每月 / 出事时</text>
  <text x="64" y="764" font-size="9" fill="#1a1a1a">附录 A 黑话词典 / 附录 B 问 AI 模板库 / 附录 C 本图</text>

  <!-- dependency arrows -->
  <line x1="490" y1="254" x2="490" y2="286" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="510" y="274" font-size="9" fill="#6a6a6a">世界观给了操作的地基</text>
  <line x1="490" y1="490" x2="490" y2="522" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="510" y="510" font-size="9" fill="#6a6a6a">操作给了判断的底气</text>
  <line x1="490" y1="650" x2="490" y2="682" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="510" y="670" font-size="9" fill="#6a6a6a">判断最后压成一页纸</text>

  <text x="40" y="826" font-size="9" fill="#6a6a6a">刨根问底的路径藏在这里：每个概念都可以再往下问一层为什么——答案就在它所属章节的「为什么会这样」一节。</text>
</svg>
