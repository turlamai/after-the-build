<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 365" width="640" height="365"><title>两条独立 TCP 连接与监听套接字</title><g font-family="system-ui,sans-serif" font-size="16" fill="currentColor"><rect x="15" y="30" width="210" height="64" rx="4" stroke="currentColor" fill="none"/><text x="120" y="67" text-anchor="middle" >客户端 A :51001</text><rect x="15" y="150" width="210" height="64" rx="4" stroke="currentColor" fill="none"/><text x="120" y="187" text-anchor="middle" >客户端 B :51002</text><rect x="405" y="30" width="220" height="64" rx="4" stroke="currentColor" fill="none"/><text x="515" y="67" text-anchor="middle" >连接 A :8080</text><rect x="405" y="150" width="220" height="64" rx="4" stroke="currentColor" fill="none"/><text x="515" y="187" text-anchor="middle" >连接 B :8080</text><path d="M225 62L405 62" stroke="currentColor" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(405 62) rotate(0)" stroke="currentColor" fill="none"/><path d="M225 182L405 182" stroke="currentColor" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(405 182) rotate(0)" stroke="currentColor" fill="none"/><text x="315" y="49" text-anchor="middle" font-size='13'>TCP 连接 A</text><text x="315" y="169" text-anchor="middle" font-size='13'>TCP 连接 B</text><rect x="405" y="255" width="220" height="50" rx="4" stroke="currentColor" fill="none"/><text x="515" y="285" text-anchor="middle" >监听套接字 :8080</text><path d="M625 280H635V62H625M635 182H625" stroke="currentColor" fill="none"/><path d="M632 58l-7 4 7 4M632 178l-7 4 7 4" stroke="currentColor" fill="none"/><text x="290" y="264" text-anchor="middle" font-size='14'>accept 返回独立连接</text><text x="320" y="340" text-anchor="middle" font-size='13'>客户端端口仅为教学值；连接还由双方 IP 地址区分</text></g></svg>