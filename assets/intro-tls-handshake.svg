<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" width="600" height="390"><title>典型 TLS 1.3 完整握手简化示意</title><g font-family="system-ui,sans-serif" font-size="16" fill="currentColor"><text x="85" y="20" text-anchor="middle">客户端</text><text x="515" y="20" text-anchor="middle">服务器</text><g stroke="currentColor" stroke-dasharray="4 4"><path d="M85 32V345M515 32V345"/></g><path d="M85 65L515 65" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(515 65) rotate(0)" stroke="currentColor" fill="none"/><path d="M515 112L85 112" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(85 112) rotate(180)" stroke="currentColor" fill="none"/><path d="M515 175L85 175" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(85 175) rotate(180)" stroke="currentColor" fill="none"/><path d="M85 245L515 245" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(515 245) rotate(0)" stroke="currentColor" fill="none"/><path d="M85 305L515 305" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(515 305) rotate(0)" stroke="currentColor" fill="none"/><path d="M515 335L85 335" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(85 335) rotate(180)" stroke="currentColor" fill="none"/><g text-anchor="middle" font-size="14"><text x="300" y="56">ClientHello：参数与密钥共享</text><text x="300" y="103">ServerHello：参数与密钥共享</text><text x="300" y="147">受保护的后续握手消息</text><text x="300" y="165">证书、握手签名、Finished 等</text><text x="300" y="206">客户端验证证书及握手</text><text x="300" y="236">客户端 Finished</text><text x="300" y="296">受保护的 HTTP 请求</text><text x="300" y="326">受保护的 HTTP 响应</text><text x="300" y="375" font-size="13">省略其他消息及密钥派生细节</text></g></g></svg>