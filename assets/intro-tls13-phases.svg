<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 375" width="640" height="375"><title>TLS 1.3 典型完整握手</title><g font-family="system-ui,sans-serif" font-size="14" fill="currentColor" text-anchor="middle"><text x="75" y="23">客户端</text><text x="565" y="23">服务端</text><path d="M75 35V340M565 35V340" stroke="currentColor" stroke-dasharray="4 4"/><path d="M75 65H565l-8 -4m8 4-8 4M565 100H75l8 -4m-8 4 8 4" stroke="currentColor" fill="none"/><text x="320" y="58">ClientHello（公开密钥共享信息）</text><text x="320" y="93">ServerHello（选择参数）</text><rect x="90" y="120" width="460" height="150" rx="5" stroke="#c4683f" fill="#c4683f" fill-opacity=".07"/><text x="320" y="141">建立握手密钥后</text><path d="M565 170H75l8 -4m-8 4 8 4M565 210H75l8 -4m-8 4 8 4M75 248H565l-8 -4m8 4-8 4" stroke="currentColor" fill="none"/><text x="320" y="163">EncryptedExtensions / Certificate</text><text x="320" y="203">CertificateVerify / Finished</text><text x="320" y="241">客户端 Finished</text><path d="M75 310H565l-8 -4m8 4-8 4M565 332H75l8 -4m-8 4 8 4" stroke="currentColor" fill="none"/><text x="320" y="300">应用数据密钥保护 HTTP 等消息</text><text x="320" y="363" font-size="12">简化完整握手；不展示恢复、早期数据及客户端证书分支</text></g></svg>