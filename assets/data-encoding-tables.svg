<svg xmlns="http://www.w3.org/2000/svg" width="650" viewBox="0 0 980 360" font-family="PingFang SC, Microsoft YaHei, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <rect width="980" height="360" fill="#f8f6f3"/>
  <text x="40" y="34" font-size="13" font-weight="600" fill="#1a1a1a">同一串字节，两张翻译表</text>

  <rect x="40" y="120" width="230" height="110" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="155" y="160" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle">一串字节</text>
  <text x="155" y="192" font-size="10" fill="#6a6a6a" text-anchor="middle">E6 B5 8B E8 AF 95 …</text>
  <text x="155" y="212" font-size="8" fill="#6a6a6a" text-anchor="middle">文件的本体从没变过</text>

  <rect x="430" y="60" width="230" height="80" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="545" y="94" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">翻译表 A：UTF-8</text>
  <text x="545" y="118" font-size="9" fill="#6a6a6a" text-anchor="middle">今天的世界标准</text>

  <rect x="430" y="210" width="230" height="80" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="545" y="244" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">翻译表 B：老编码（如 GBK）</text>
  <text x="545" y="268" font-size="9" fill="#6a6a6a" text-anchor="middle">历史遗留，还在流传</text>

  <rect x="760" y="60" width="180" height="80" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="850" y="106" font-size="16" font-weight="600" fill="#1a1a1a" text-anchor="middle">测试</text>

  <rect x="760" y="210" width="180" height="80" rx="12" fill="#f4e4c1" stroke="#d97757" stroke-width="2"/>
  <text x="850" y="244" font-size="14" fill="#d97757" text-anchor="middle">æµ‹è¯•</text>
  <text x="850" y="270" font-size="9" fill="#6a6a6a" text-anchor="middle">传说中的乱码</text>

  <line x1="270" y1="155" x2="426" y2="105" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="270" y1="195" x2="426" y2="245" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="100" x2="756" y2="100" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="250" x2="756" y2="250" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="40" y="330" font-size="9" fill="#6a6a6a">乱码不是数据坏了，是读的人拿错了表。自救：换 UTF-8 重开；出口：导出时永远选 UTF-8。</text>
</svg>
