<svg xmlns="http://www.w3.org/2000/svg" width="650" viewBox="0 0 900 380" font-family="PingFang SC, Microsoft YaHei, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#f8f6f3"/>
  <text x="40" y="34" font-size="13" font-weight="600" fill="#1a1a1a">两种说法，同一台机器</text>

  <rect x="40" y="80" width="230" height="80" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="155" y="112" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle">GUI 图形界面</text>
  <text x="155" y="136" font-size="9" fill="#1a1a1a" text-anchor="middle">按钮、图标，看得见摸得着</text>

  <rect x="40" y="230" width="230" height="80" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="155" y="262" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle">命令行</text>
  <text x="155" y="286" font-size="9" fill="#1a1a1a" text-anchor="middle">黑底白字窗口，打字下指令</text>

  <rect x="430" y="140" width="200" height="100" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="530" y="182" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle">电脑的核心</text>
  <text x="530" y="206" font-size="9" fill="#1a1a1a" text-anchor="middle">只认真指令，不认语境</text>

  <rect x="700" y="140" width="160" height="100" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="780" y="182" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">结果</text>
  <text x="780" y="206" font-size="9" fill="#6a6a6a" text-anchor="middle">机器做完给你看</text>

  <path d="M 270 120 L 350 120 L 350 172 L 426 172" fill="none" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="108" font-size="9" fill="#6a6a6a" text-anchor="middle">点击 = 一条指令</text>

  <path d="M 270 270 L 350 270 L 350 208 L 426 208" fill="none" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="296" font-size="9" fill="#6a6a6a" text-anchor="middle">打字 = 一条指令</text>

  <line x1="630" y1="190" x2="696" y2="190" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="40" y="356" font-size="9" fill="#6a6a6a">GUI 好懂但有天花板：没有按钮的事它做不了。AI 给你的很多指令，恰好是没有按钮的事。</text>
</svg>
