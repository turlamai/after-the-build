<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" height="210"><title>IEEE 754 单精度字段</title><g font-family="system-ui,sans-serif" fill="currentColor" font-size="16"><rect x="25" y="30" width="100" height="65" rx="3" stroke="currentColor" fill="none"/><text x="75" y="58" text-anchor="middle" >符号 s</text><text x="75" y="82" text-anchor="middle" font-size='13'>1 位</text><rect x="125" y="30" width="190" height="65" rx="3" stroke="currentColor" fill="none"/><text x="220" y="58" text-anchor="middle" >指数编码 E</text><text x="220" y="82" text-anchor="middle" font-size='13'>8 位</text><rect x="315" y="30" width="300" height="65" rx="3" stroke="currentColor" fill="none"/><text x="465" y="58" text-anchor="middle" >小数部分 f</text><text x="465" y="82" text-anchor="middle" font-size='13'>23 位</text><text x="320" y="137" text-anchor="middle" font-size='14'>普通规格化有限非零数：</text><text x="320" y="166" text-anchor="middle" >(−1)ˢ × (1 + f) × 2⁽ᴱ⁻¹²⁷⁾</text><text x="320" y="191" text-anchor="middle" font-size='13'>特殊指数编码适用其他规则</text></g></svg>