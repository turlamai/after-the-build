<svg xmlns="http://www.w3.org/2000/svg" width="650" viewBox="0 0 950 430" font-family="PingFang SC, Microsoft YaHei, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <rect width="950" height="430" fill="#f8f6f3"/>
  <text x="40" y="34" font-size="13" font-weight="600" fill="#1a1a1a">3-2-1，翻译成普通话</text>

  <rect x="40" y="180" width="220" height="90" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="150" y="212" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle">你的数据（正本）</text>
  <text x="150" y="236" font-size="9" fill="#1a1a1a" text-anchor="middle">只有一份的时候，等于没有</text>

  <rect x="430" y="60" width="260" height="64" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="560" y="86" font-size="10" fill="#1a1a1a" text-anchor="middle">第 2 份：本机另一个位置</text>
  <text x="560" y="106" font-size="8" fill="#6a6a6a" text-anchor="middle">防手滑误删、覆盖保存</text>

  <rect x="430" y="190" width="260" height="64" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="560" y="216" font-size="10" fill="#1a1a1a" text-anchor="middle">第 3 份：云端</text>
  <text x="560" y="236" font-size="8" fill="#6a6a6a" text-anchor="middle">防电脑本身出事</text>

  <rect x="430" y="320" width="260" height="64" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="560" y="346" font-size="10" fill="#1a1a1a" text-anchor="middle">其中一份：不在同一屋檐下</text>
  <text x="560" y="366" font-size="8" fill="#6a6a6a" text-anchor="middle">防一场事故端掉所有副本</text>

  <path d="M 260 200 L 340 200 L 340 92 L 426 92" fill="none" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 260 225 L 426 225" fill="none" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 260 250 L 340 250 L 340 352 L 426 352" fill="none" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="740" y="140" width="180" height="150" rx="12" fill="#f4e4c1" stroke="#d97757" stroke-width="1.5"/>
  <text x="830" y="172" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">3-2-1 口诀</text>
  <text x="830" y="202" font-size="9" fill="#1a1a1a" text-anchor="middle">3＝存三份</text>
  <text x="830" y="228" font-size="9" fill="#1a1a1a" text-anchor="middle">2＝两种不同的地方</text>
  <text x="830" y="254" font-size="9" fill="#1a1a1a" text-anchor="middle">1＝一份在别处</text>

  <text x="40" y="414" font-size="9" fill="#6a6a6a">没验证过能打开的备份，等于没有备份——每季度真的导出一次、打开看一次。</text>
</svg>
