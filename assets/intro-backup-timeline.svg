<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260"><title>备份点与故障点之间的损失窗口</title><g font-family="system-ui,sans-serif" font-size="17" fill="currentColor"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M35 110H570m-8-6 8 6-8 6"/><path d="M100 70V140M330 70V140M515 70V140"/><path d="M330 170V185H515V170"/></g><rect x="330" y="95" width="185" height="30" fill="currentColor" opacity=".12"/><g text-anchor="middle" font-size="16"><text x="100" y="55">上次备份</text><text x="330" y="55">最近备份</text><text x="515" y="55">设备故障</text><text x="422" y="210">可能损失的修改</text><text x="300" y="245" font-size="14">仅有定期备份、没有其他恢复材料的简化情形</text></g></g></svg>