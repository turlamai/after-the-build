<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" height="210"><title>普通 Ethernet II 帧字段</title><g font-family="system-ui,sans-serif" font-size="16" fill="currentColor"><rect x="15" y="45" width="110" height="72" stroke="currentColor" fill="none"/><text x="70" y="73" text-anchor="middle" font-size='14'>目的 MAC</text><text x="70" y="99" text-anchor="middle" font-size='13'>6 字节</text><rect x="125" y="45" width="110" height="72" stroke="currentColor" fill="none"/><text x="180" y="73" text-anchor="middle" font-size='14'>源 MAC</text><text x="180" y="99" text-anchor="middle" font-size='13'>6 字节</text><rect x="235" y="45" width="100" height="72" stroke="currentColor" fill="none"/><text x="285" y="73" text-anchor="middle" font-size='14'>类型</text><text x="285" y="99" text-anchor="middle" font-size='13'>2 字节</text><rect x="335" y="45" width="195" height="72" stroke="currentColor" fill="none"/><text x="432.5" y="73" text-anchor="middle" font-size='14'>数据与填充</text><text x="432.5" y="99" text-anchor="middle" font-size='13'>46–1500 字节</text><rect x="530" y="45" width="95" height="72" stroke="currentColor" fill="none"/><text x="577.5" y="73" text-anchor="middle" font-size='14'>FCS</text><text x="577.5" y="99" text-anchor="middle" font-size='13'>4 字节</text><text x="320" y="155" text-anchor="middle" font-size='14'>常见未标记帧：64–1518 字节（字段宽度不按比例）</text><text x="320" y="184" text-anchor="middle" font-size='13'>不含物理层前导码、帧开始定界符及帧间间隔</text></g></svg>