<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" height="210"><title>中 的 UTF-8 编码</title><g font-family="system-ui,sans-serif" fill="currentColor" font-size="16"><text x="320" y="25" text-anchor="middle" >U+4E2D = 0100 111000 101101</text><path d="M172 38L116 78" stroke="currentColor" fill="none"/><rect x="24" y="78" width="184" height="60" rx="4" stroke="currentColor" fill="none"/><text x="116" y="103" text-anchor="middle" >1110 | 0100</text><text x="116" y="128" text-anchor="middle" fill='#c4683f'>E4</text><path d="M320 38L320 78" stroke="currentColor" fill="none"/><rect x="228" y="78" width="184" height="60" rx="4" stroke="currentColor" fill="none"/><text x="320" y="103" text-anchor="middle" >10 | 111000</text><text x="320" y="128" text-anchor="middle" fill='#c4683f'>B8</text><path d="M468 38L524 78" stroke="currentColor" fill="none"/><rect x="432" y="78" width="184" height="60" rx="4" stroke="currentColor" fill="none"/><text x="524" y="103" text-anchor="middle" >10 | 101101</text><text x="524" y="128" text-anchor="middle" fill='#c4683f'>AD</text><text x="320" y="180" text-anchor="middle" font-size='14'>固定前缀 | 来自码点的有效位</text></g></svg>