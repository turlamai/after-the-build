<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300"><title>名称查询与网站访问的不同路径</title><g font-family="system-ui,sans-serif" font-size="16" fill="currentColor"><rect x="20" y="100" width="140" height="60" rx="6" fill="none" stroke="currentColor"/><text x="90" y="135" text-anchor="middle">浏览器</text><rect x="220" y="15" width="190" height="55" rx="6" fill="none" stroke="currentColor"/><text x="315" y="47.5" text-anchor="middle">DNS 解析服务</text><rect x="400" y="100" width="180" height="60" rx="6" fill="none" stroke="currentColor"/><text x="490" y="135" text-anchor="middle">公开访问入口</text><rect x="400" y="205" width="180" height="55" rx="6" fill="none" stroke="currentColor"/><text x="490" y="237.5" text-anchor="middle">应用运行环境</text><path d="M90 100V42H220M160 130H400M490 160V205" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="125" y="35" font-size="13">名称查询</text><text x="280" y="120" text-anchor="middle" font-size="14">HTTP 请求与响应</text><text x="300" y="281" text-anchor="middle" font-size="14">DNS 提供地址信息，不负责执行应用</text></g></svg>