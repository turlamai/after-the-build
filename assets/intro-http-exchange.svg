<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 305" width="640" height="305"><title>HTTP 请求及响应的往返方向</title><g font-family="system-ui,sans-serif" font-size="16" fill="currentColor"><rect x="20" y="15" width="160" height="45" rx="4" stroke="currentColor" fill="none"/><text x="100" y="42.5" text-anchor="middle" >客户端</text><rect x="460" y="15" width="160" height="45" rx="4" stroke="currentColor" fill="none"/><text x="540" y="42.5" text-anchor="middle" >服务端</text><path d="M100 60V250M540 60V250" stroke="currentColor" stroke-dasharray="4 4" fill="none"/><path d="M100 100L540 100" stroke="currentColor" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(540 100) rotate(0)" stroke="currentColor" fill="none"/><text x="320" y="86" text-anchor="middle" font-size='14'>GET /remaining HTTP/1.1</text><text x="320" y="121" text-anchor="middle" font-size='13'>Host: registration.example.com</text><rect x="470" y="139" width="140" height="42" rx="4" stroke="currentColor" fill="none"/><text x="540" y="165" text-anchor="middle" >查询剩余名额</text><path d="M540 222L100 222" stroke="currentColor" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(100 222) rotate(180)" stroke="currentColor" fill="none"/><text x="320" y="207" text-anchor="middle" font-size='14'>HTTP/1.1 200 OK</text><text x="320" y="243" text-anchor="middle" font-size='13'>Content-Length: 1；消息体：3</text><text x="320" y="282" text-anchor="middle" font-size='14'>请求与响应属于同一次 HTTP 交互</text></g></svg>