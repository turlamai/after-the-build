<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260"><title>输入、模型参数和预测误差</title><g font-family="system-ui,sans-serif" font-size="16" fill="currentColor"><rect x="20" y="25" width="155" height="55" rx="6" fill="none" stroke="currentColor"/><text x="97.5" y="57.5" text-anchor="middle">输入 x = 4</text><rect x="220" y="25" width="160" height="55" rx="6" fill="none" stroke="currentColor"/><text x="300" y="57.5" text-anchor="middle">模型 2x + 3</text><rect x="425" y="25" width="155" height="55" rx="6" fill="none" stroke="currentColor"/><text x="502.5" y="57.5" text-anchor="middle">预测值 11</text><path d="M175 52L220 52" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(220 52) rotate(0)" stroke="currentColor" fill="none"/><path d="M380 52L425 52" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(425 52) rotate(0)" stroke="currentColor" fill="none"/><rect x="425" y="140" width="155" height="55" rx="6" fill="none" stroke="currentColor"/><text x="502.5" y="172.5" text-anchor="middle">观测值 12</text><rect x="220" y="140" width="160" height="55" rx="6" fill="none" stroke="currentColor"/><text x="300" y="172.5" text-anchor="middle">计算误差</text><path d="M425 167L380 167" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(380 167) rotate(180)" stroke="currentColor" fill="none"/><path d="M502 80V108H300V140" stroke="currentColor" stroke-width="1.6" fill="none"/><text x="300" y="235" text-anchor="middle" font-size="14">教学假设：利用观测评价预测，不是实际活动数据</text></g></svg>