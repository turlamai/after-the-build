<svg xmlns="http://www.w3.org/2000/svg" width="650" viewBox="0 0 1000 460" font-family="PingFang SC, Microsoft YaHei, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <rect width="1000" height="460" fill="#f8f6f3"/>
  <text x="40" y="34" font-size="13" font-weight="600" fill="#1a1a1a">不需要窃听：同一块牌子埋在无数网页里，画像自己拼出来</text>

  <rect x="60" y="70" width="330" height="90" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="225" y="100" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">网站 A（购物）</text>
  <rect x="200" y="118" width="160" height="30" rx="6" fill="#d97757"/>
  <text x="280" y="138" font-size="9" fill="#ffffff" text-anchor="middle">第三方追踪器（B 家的牌）</text>

  <rect x="60" y="180" width="330" height="90" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="225" y="210" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">网站 B（新闻）</text>
  <rect x="200" y="228" width="160" height="30" rx="6" fill="#d97757"/>
  <text x="280" y="248" font-size="9" fill="#ffffff" text-anchor="middle">第三方追踪器（B 家的牌）</text>

  <rect x="60" y="290" width="330" height="90" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="225" y="320" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">网站 C（论坛）</text>
  <rect x="200" y="338" width="160" height="30" rx="6" fill="#d97757"/>
  <text x="280" y="358" font-size="9" fill="#ffffff" text-anchor="middle">第三方追踪器（B 家的牌）</text>

  <rect x="560" y="180" width="200" height="100" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="660" y="222" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">广告商 B</text>
  <text x="660" y="248" font-size="8" fill="#6a6a6a" text-anchor="middle">收回同一块牌：你到过 A、B、C</text>

  <rect x="800" y="170" width="170" height="120" rx="12" fill="#d97757" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="885" y="214" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">你的画像</text>
  <text x="885" y="238" font-size="8" fill="#ffffff" text-anchor="middle">去过哪、停多久、点了什么</text>
  <text x="885" y="256" font-size="8" fill="#ffffff" text-anchor="middle">拼图比窃听好用</text>

  <line x1="390" y1="115" x2="556" y2="205" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="225" x2="556" y2="225" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="335" x2="556" y2="245" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="230" x2="796" y2="230" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="40" y="428" font-size="9" fill="#6a6a6a">你聊完天只是去搜索了一次那个词，画像立刻更新。默认姿势：假设自己被追踪，除非主动做点什么。</text>
</svg>
