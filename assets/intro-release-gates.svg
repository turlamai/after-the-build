<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250"><title>逐步扩大新版流量</title><g font-family="system-ui,sans-serif" font-size="16" fill="currentColor"><rect x="10" y="50" width="80" height="120" rx="4" fill="none" stroke="currentColor"/><rect x="11" y="169" width="78" height="0" fill="#c4683f" fill-opacity=".45"/><text x="50" y="190" text-anchor="middle" font-size="13">0%</text><rect x="110" y="50" width="80" height="120" rx="4" fill="none" stroke="currentColor"/><rect x="111" y="157" width="78" height="12" fill="#c4683f" fill-opacity=".45"/><text x="150" y="190" text-anchor="middle" font-size="13">10%</text><rect x="210" y="50" width="80" height="120" rx="4" fill="none" stroke="currentColor"/><rect x="211" y="145" width="78" height="24" fill="#c4683f" fill-opacity=".45"/><text x="250" y="190" text-anchor="middle" font-size="13">20%</text><rect x="310" y="50" width="80" height="120" rx="4" fill="none" stroke="currentColor"/><rect x="311" y="109" width="78" height="60" fill="#c4683f" fill-opacity=".45"/><text x="350" y="190" text-anchor="middle" font-size="13">50%</text><rect x="410" y="50" width="80" height="120" rx="4" fill="none" stroke="currentColor"/><rect x="411" y="73" width="78" height="96" fill="#c4683f" fill-opacity=".45"/><text x="450" y="190" text-anchor="middle" font-size="13">80%</text><rect x="510" y="50" width="80" height="120" rx="4" fill="none" stroke="currentColor"/><rect x="511" y="51" width="78" height="118" fill="#c4683f" fill-opacity=".45"/><text x="550" y="190" text-anchor="middle" font-size="13">100%</text><text x="300" y="26" text-anchor="middle">新版流量占比（假设）</text><text x="300" y="225" text-anchor="middle" font-size="14">每次扩大前检查业务结果与运行指标</text></g></svg>