<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="system-ui, sans-serif"><rect width="760" height="460" rx="12" fill="#FAF9F6"/><text x="32" y="42" font-size="22" font-weight="600" fill="#2A2820">TCP/IP 封装关系（以 HTTP/1.1 over TLS 为例）</text><rect x="32" y="66" width="696" height="62" rx="7" fill="#FFFFFF" stroke="#D9D3C7"/><text x="49" y="91" font-size="17" font-weight="600" fill="#2A2820">应用层</text><text x="49" y="113" font-size="15" fill="#4A4740">HTTP 请求 → TLS 记录</text><path d="M380 128 v15 m-5 -5 l5 5 5 -5" stroke="#C4683F" stroke-width="2" fill="none"/><rect x="32" y="149" width="696" height="62" rx="7" fill="#FFFFFF" stroke="#D9D3C7"/><text x="49" y="174" font-size="17" font-weight="600" fill="#2A2820">传输层</text><text x="49" y="196" font-size="15" fill="#4A4740">TCP 首部 + 数据</text><path d="M380 211 v15 m-5 -5 l5 5 5 -5" stroke="#C4683F" stroke-width="2" fill="none"/><rect x="32" y="232" width="696" height="62" rx="7" fill="#FFFFFF" stroke="#D9D3C7"/><text x="49" y="257" font-size="17" font-weight="600" fill="#2A2820">网络层</text><text x="49" y="279" font-size="15" fill="#4A4740">IP 首部 + TCP 段</text><path d="M380 294 v15 m-5 -5 l5 5 5 -5" stroke="#C4683F" stroke-width="2" fill="none"/><rect x="32" y="315" width="696" height="62" rx="7" fill="#FFFFFF" stroke="#D9D3C7"/><text x="49" y="340" font-size="17" font-weight="600" fill="#2A2820">链路层</text><text x="49" y="362" font-size="15" fill="#4A4740">帧首部 + IP 数据报 + 帧尾</text><text x="32" y="428" font-size="13" fill="#4A4740">示意为逻辑封装，不表示各层数据单元严格一一对应。</text></svg>
