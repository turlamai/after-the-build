<svg xmlns="http://www.w3.org/2000/svg" width="650" viewBox="0 0 1000 430" font-family="PingFang SC, Microsoft YaHei, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <rect width="1000" height="430" fill="#f8f6f3"/>
  <text x="40" y="34" font-size="13" font-weight="600" fill="#1a1a1a">一次点击的旅程</text>

  <rect x="40" y="90" width="210" height="90" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="145" y="126" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle">你的浏览器</text>
  <text x="145" y="148" font-size="9" fill="#1a1a1a" text-anchor="middle">客户端：敲门的一方</text>

  <rect x="350" y="90" width="210" height="90" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="455" y="126" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle">DNS 查号台</text>
  <text x="455" y="148" font-size="9" fill="#1a1a1a" text-anchor="middle">把名字翻译成门牌号</text>

  <rect x="660" y="90" width="240" height="90" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="780" y="126" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle">服务器</text>
  <text x="780" y="148" font-size="9" fill="#1a1a1a" text-anchor="middle">开门的一方：不关机的电脑</text>

  <line x1="250" y1="135" x2="346" y2="135" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="122" font-size="9" fill="#6a6a6a" text-anchor="middle">① 输入网址</text>

  <line x1="560" y1="135" x2="656" y2="135" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="610" y="122" font-size="9" fill="#6a6a6a" text-anchor="middle">② 查到 IP 门牌号</text>

  <path d="M 780 180 L 780 270 L 145 270 L 145 184" fill="none" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="462" y="262" font-size="9" fill="#6a6a6a" text-anchor="middle">③ 网页内容寄回来，浏览器负责把它画出来</text>

  <rect x="350" y="320" width="320" height="60" rx="12" fill="#e8e6e3" stroke="#d97757" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="510" y="345" font-size="10" fill="#1a1a1a" text-anchor="middle">localhost：只指向设备自己</text>
  <text x="510" y="366" font-size="9" fill="#d97757" text-anchor="middle">发给别人 = 让朋友去敲他自己家的门</text>

  <text x="40" y="414" font-size="9" fill="#6a6a6a">序章悬案的谜底：那个地址从来不是「你的网页的地址」，而是每台设备自己的地址。</text>
</svg>
