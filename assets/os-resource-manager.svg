<svg xmlns="http://www.w3.org/2000/svg" width="650" viewBox="0 0 980 430" font-family="PingFang SC, Microsoft YaHei, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <rect width="980" height="430" fill="#f8f6f3"/>
  <text x="40" y="34" font-size="13" font-weight="600" fill="#1a1a1a">操作系统：所有程序和硬件之间的管家</text>

  <rect x="60" y="70" width="220" height="64" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="170" y="96" font-size="10" fill="#1a1a1a" text-anchor="middle">进程 A（浏览器）</text>
  <text x="170" y="116" font-size="8" fill="#6a6a6a" text-anchor="middle">一个软件可能开好几个进程</text>

  <rect x="380" y="70" width="220" height="64" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="490" y="96" font-size="10" fill="#1a1a1a" text-anchor="middle">进程 B（你造的应用）</text>
  <text x="490" y="116" font-size="8" fill="#6a6a6a" text-anchor="middle">上线后也是服务器上的一个进程</text>

  <rect x="700" y="70" width="220" height="64" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="810" y="96" font-size="10" fill="#1a1a1a" text-anchor="middle">进程 C（音乐播放器）</text>
  <text x="810" y="116" font-size="8" fill="#6a6a6a" text-anchor="middle">闹事的进程会被管家请出去</text>

  <rect x="60" y="200" width="860" height="40" rx="8" fill="#d97757"/>
  <text x="490" y="226" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">操作系统 · 分时间片，分内存，替你把关所有权限</text>

  <rect x="60" y="320" width="200" height="64" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="160" y="358" font-size="10" fill="#1a1a1a" text-anchor="middle">CPU</text>
  <rect x="290" y="320" width="200" height="64" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="390" y="358" font-size="10" fill="#1a1a1a" text-anchor="middle">内存</text>
  <rect x="520" y="320" width="200" height="64" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="620" y="358" font-size="10" fill="#1a1a1a" text-anchor="middle">相机 / 麦克风 / 网络</text>
  <rect x="750" y="320" width="170" height="64" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="835" y="358" font-size="10" fill="#1a1a1a" text-anchor="middle">硬盘</text>

  <line x1="170" y1="134" x2="170" y2="196" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="134" x2="490" y2="196" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="810" y1="134" x2="810" y2="196" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="160" y1="240" x2="160" y2="316" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="240" x2="390" y2="316" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="240" x2="620" y2="316" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="835" y1="240" x2="835" y2="316" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="40" y="412" font-size="9" fill="#6a6a6a">权限弹窗就是管家在把关：程序不能直接摸硬件。拒绝一个可疑权限，软件一般还能用。</text>
</svg>
