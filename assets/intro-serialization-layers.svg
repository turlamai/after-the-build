<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 235" width="640" height="235"><title>数据表示的三层转换</title><g font-family="system-ui,sans-serif" font-size="16" fill="currentColor"><rect x="15" y="25" width="185" height="50" rx="4" stroke="currentColor" fill="none"/><text x="107.5" y="55" text-anchor="middle" >程序字典</text><rect x="230" y="25" width="180" height="50" rx="4" stroke="currentColor" fill="none"/><text x="320" y="55" text-anchor="middle" >JSON 字符串</text><rect x="440" y="25" width="185" height="50" rx="4" stroke="currentColor" fill="none"/><text x="532.5" y="55" text-anchor="middle" >UTF-8 字节</text><path d="M200 50L230 50" stroke="currentColor" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(230 50) rotate(0)" stroke="currentColor" fill="none"/><path d="M410 50L440 50" stroke="currentColor" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(440 50) rotate(0)" stroke="currentColor" fill="none"/><text x="215" y="15" text-anchor="middle" font-size='12'>序列化</text><text x="425" y="15" text-anchor="middle" font-size='12'>编码</text><text x="107" y="108" text-anchor="middle" font-size='14'>name → 小林</text><text x="320" y="108" text-anchor="middle" font-size='13'>{"name":"小林"}</text><text x="532" y="108" text-anchor="middle" font-size='14'>7B 22 … 7D</text><path d="M440 150L410 150" stroke="currentColor" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(410 150) rotate(180)" stroke="currentColor" fill="none"/><path d="M230 150L200 150" stroke="currentColor" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(200 150) rotate(180)" stroke="currentColor" fill="none"/><text x="425" y="174" text-anchor="middle" font-size='13'>解码</text><text x="215" y="174" text-anchor="middle" font-size='13'>反序列化</text><text x="320" y="213" text-anchor="middle" font-size='14'>结构、文本格式和字符编码承担不同职责</text></g></svg>