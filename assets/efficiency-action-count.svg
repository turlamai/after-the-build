<svg xmlns="http://www.w3.org/2000/svg" width="650" viewBox="0 0 1000 440" font-family="PingFang SC, Microsoft YaHei, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <rect width="1000" height="440" fill="#f8f6f3"/>
  <text x="40" y="34" font-size="13" font-weight="600" fill="#1a1a1a">效率的算术：数据 ×10，时间 ×10 还是 ×10000</text>

  <text x="150" y="80" font-size="10" fill="#1a1a1a" text-anchor="middle">数据量</text>
  <text x="470" y="80" font-size="10" fill="#1a1a1a" text-anchor="middle">翻一遍（线性）</text>
  <text x="800" y="80" font-size="10" fill="#1a1a1a" text-anchor="middle">每条再翻一遍（平方）</text>

  <rect x="60" y="100" width="180" height="64" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="150" y="126" font-size="10" fill="#1a1a1a" text-anchor="middle">一百条</text>
  <text x="150" y="148" font-size="9" fill="#6a6a6a" text-anchor="middle">小工具起步</text>

  <rect x="60" y="190" width="180" height="64" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="150" y="216" font-size="10" fill="#1a1a1a" text-anchor="middle">一万条</text>
  <text x="150" y="238" font-size="9" fill="#6a6a6a" text-anchor="middle">用了半年</text>

  <rect x="60" y="280" width="180" height="64" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="150" y="306" font-size="10" fill="#1a1a1a" text-anchor="middle">十万条</text>
  <text x="150" y="328" font-size="9" fill="#6a6a6a" text-anchor="middle">用了几年</text>

  <rect x="360" y="100" width="220" height="64" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="470" y="126" font-size="10" fill="#1a1a1a" text-anchor="middle">一百次动作</text>
  <text x="470" y="148" font-size="9" fill="#6a6a6a" text-anchor="middle">瞬间</text>

  <rect x="360" y="190" width="220" height="64" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="470" y="216" font-size="10" fill="#1a1a1a" text-anchor="middle">一万次动作</text>
  <text x="470" y="238" font-size="9" fill="#6a6a6a" text-anchor="middle">依然流畅</text>

  <rect x="360" y="280" width="220" height="64" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="470" y="306" font-size="10" fill="#1a1a1a" text-anchor="middle">十万次动作</text>
  <text x="470" y="328" font-size="9" fill="#6a6a6a" text-anchor="middle">开始有感</text>

  <rect x="690" y="100" width="220" height="64" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="800" y="126" font-size="10" fill="#1a1a1a" text-anchor="middle">一万次动作</text>
  <text x="800" y="148" font-size="9" fill="#6a6a6a" text-anchor="middle">瞬间</text>

  <rect x="690" y="190" width="220" height="64" rx="12" fill="#f4e4c1" stroke="#d97757" stroke-width="1.5"/>
  <text x="800" y="216" font-size="10" fill="#1a1a1a" text-anchor="middle">一亿次动作</text>
  <text x="800" y="238" font-size="9" fill="#d97757" text-anchor="middle">肉眼可见的等待</text>

  <rect x="690" y="280" width="220" height="64" rx="12" fill="#d97757" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="800" y="306" font-size="10" fill="#ffffff" text-anchor="middle">一百亿次动作</text>
  <text x="800" y="328" font-size="9" fill="#ffffff" text-anchor="middle">像死机一样</text>

  <line x1="240" y1="132" x2="356" y2="132" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="222" x2="356" y2="222" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="312" x2="356" y2="312" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="132" x2="686" y2="132" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="222" x2="686" y2="222" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="312" x2="686" y2="312" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="40" y="384" font-size="9" fill="#6a6a6a">数据小的时候两种写法没有区别——所以问题总在你最没防备的时候出现。解法只有两个：改成翻一遍，或给常用的查找留快捷方式（索引）。</text>
</svg>
