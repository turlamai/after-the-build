<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300"><title>Agent 执行与验收的反馈路径</title><g font-family="system-ui,sans-serif" font-size="16" fill="currentColor" text-anchor="middle"><g stroke="currentColor" fill="none"><rect x="15" y="25" width="175" height="48" rx="4"/><rect x="230" y="25" width="175" height="48" rx="4"/><rect x="445" y="25" width="175" height="48" rx="4"/><rect x="445" y="120" width="175" height="48" rx="4"/><rect x="230" y="120" width="175" height="48" rx="4"/><rect x="15" y="120" width="175" height="48" rx="4"/><path d="M190 49H230l-7 -4m7 4-7 4M405 49H445l-7 -4m7 4-7 4M532 73V120l-4-7m4 7 4-7M445 144H405l7-4m-7 4 7 4M230 144H190l7-4m-7 4 7 4"/></g><text x="102" y="54">明确任务及权限</text><text x="317" y="54">读取与计划</text><text x="532" y="54">执行变更</text><text x="532" y="149">验证实际结果</text><text x="317" y="149">满足验收条件</text><text x="102" y="149">交付及证据</text><text x="425" y="132" font-size="12">通过</text><path d="M532 168V220H210V49H230l-7-4m7 4-7 4" stroke="#c4683f" stroke-width="1.5" fill="none"/><text x="370" y="244" font-size="14">未通过：根据证据重新分析</text><text x="320" y="280" font-size="14">权限不足或无法继续时，记录阻碍并停止</text></g></svg>