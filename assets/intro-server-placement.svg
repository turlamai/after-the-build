<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300"><title>同机与分机部署</title><g font-family="system-ui,sans-serif" font-size="16" fill="currentColor"><text x="20" y="24">同机部署</text><rect x="15" y="45" width="115" height="55" rx="6" fill="none" stroke="currentColor"/><text x="72.5" y="77.5" text-anchor="middle">客户端</text><rect x="175" y="33" width="410" height="82" rx="8" stroke="currentColor" fill="none" stroke-dasharray="5 4"/><rect x="190" y="46" width="170" height="55" rx="6" fill="none" stroke="currentColor"/><text x="275" y="78.5" text-anchor="middle">后端进程</text><rect x="400" y="46" width="170" height="55" rx="6" fill="none" stroke="currentColor"/><text x="485" y="78.5" text-anchor="middle">数据库</text><path d="M130 73H190M360 73H400" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="20" y="163">分机部署</text><rect x="15" y="185" width="115" height="55" rx="6" fill="none" stroke="currentColor"/><text x="72.5" y="217.5" text-anchor="middle">客户端</text><rect x="190" y="185" width="170" height="55" rx="6" fill="none" stroke="currentColor"/><text x="275" y="217.5" text-anchor="middle">后端服务器</text><rect x="400" y="185" width="170" height="55" rx="6" fill="none" stroke="currentColor"/><text x="485" y="217.5" text-anchor="middle">数据库服务器</text><path d="M130 213H190M360 213H400" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="380" y="275" text-anchor="middle" font-size="14">虚线外框表示同一台机器</text></g></svg>