<svg xmlns="http://www.w3.org/2000/svg" width="650" viewBox="0 0 1000 440" font-family="PingFang SC, Microsoft YaHei, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <rect width="1000" height="440" fill="#f8f6f3"/>
  <text x="40" y="34" font-size="13" font-weight="600" fill="#1a1a1a">密钥去过的每个地方，都算数</text>

  <rect x="40" y="180" width="230" height="90" rx="12" fill="#a8c5e6" stroke="#d97757" stroke-width="2"/>
  <text x="155" y="216" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle">密钥（API Key）</text>
  <text x="155" y="240" font-size="9" fill="#1a1a1a" text-anchor="middle">你账号的手写签名</text>

  <rect x="390" y="60" width="280" height="64" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="530" y="86" font-size="10" fill="#1a1a1a" text-anchor="middle">聊天记录</text>
  <text x="530" y="106" font-size="8" fill="#6a6a6a" text-anchor="middle">包括你和 AI 的对话、群聊</text>

  <rect x="390" y="190" width="280" height="64" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="530" y="216" font-size="10" fill="#1a1a1a" text-anchor="middle">截图</text>
  <text x="530" y="236" font-size="8" fill="#6a6a6a" text-anchor="middle">图里每一行字都看得清</text>

  <rect x="390" y="320" width="280" height="64" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="530" y="346" font-size="10" fill="#1a1a1a" text-anchor="middle">公开代码仓库</text>
  <text x="530" y="366" font-size="8" fill="#6a6a6a" text-anchor="middle">爬虫几分钟内自动扫到</text>

  <rect x="760" y="180" width="210" height="90" rx="12" fill="#d97757" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="865" y="212" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">陌生人捡到 = 冒充你</text>
  <text x="865" y="236" font-size="9" fill="#ffffff" text-anchor="middle">用你的额度，算你的账</text>

  <path d="M 270 200 L 330 200 L 330 92 L 386 92" fill="none" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 270 225 L 386 225" fill="none" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 270 250 L 330 250 L 330 352 L 386 352" fill="none" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M 670 92 L 720 92 L 720 205 L 756 205" fill="none" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 670 222 L 756 222" fill="none" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 670 352 L 720 352 L 720 240 L 756 240" fill="none" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="40" y="424" font-size="9" fill="#6a6a6a">泄露是安静的，损失是延时的。三条纪律：不发聊天、不进截图、不上仓库。</text>
</svg>
