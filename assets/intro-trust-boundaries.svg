<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260"><title>输入进入不同控制范围</title><g font-family="system-ui,sans-serif" font-size="16" fill="currentColor"><rect x="20" y="85" width="150" height="70" rx="6" fill="none" stroke="currentColor"/><text x="95" y="125" text-anchor="middle">浏览器</text><rect x="225" y="85" width="150" height="70" rx="6" fill="none" stroke="currentColor"/><text x="300" y="125" text-anchor="middle">后端服务</text><rect x="430" y="85" width="150" height="70" rx="6" fill="none" stroke="currentColor"/><text x="505" y="125" text-anchor="middle">数据库</text><path d="M170 120L225 120" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(225 120) rotate(0)" stroke="currentColor" fill="none"/><path d="M375 120L430 120" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M-7 -4L0 0L-7 4" transform="translate(430 120) rotate(0)" stroke="currentColor" fill="none"/><g stroke="currentColor" stroke-dasharray="6 4"><path d="M197 40V200M402 40V200"/></g><text x="197" y="26" text-anchor="middle" font-size="13">外部输入边界</text><text x="402" y="26" text-anchor="middle" font-size="13">数据访问边界</text><text x="300" y="235" text-anchor="middle" font-size="14">分别检查数据、身份、权限及可执行操作</text></g></svg>